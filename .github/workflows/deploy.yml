name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    env:
      TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
      TF_ORG: ${{ vars.TF_ORG }}
      TF_WORKSPACE: ${{ vars.TF_WORKSPACE }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Build and upload artifacts
        id: build
        env:
          ENVIRONMENT: production
          AWS_REGION: ${{ vars.AWS_REGION }}
          ARTIFACTS_BUCKET_NAME: oidc-auth-artifacts
        run: ./scripts/build-artifacts.sh

      - name: Update Terraform Cloud workspace variable (if changed)
        env:
          NEW_ARTIFACT_SHA: ${{ steps.build.outputs.artifact_sha }}
        run: |
          set -euo pipefail
          AUTH_HEADER="Authorization: Bearer $TF_API_TOKEN"
          WORKSPACE_ID=$(curl -s \
            --header "$AUTH_HEADER" \
            --header "Content-Type: application/vnd.api+json" \
            "https://app.terraform.io/api/v2/organizations/${TF_ORG}/workspaces/${TF_WORKSPACE}" \
            | jq -r '.data.id')

          VAR_JSON=$(curl -s \
            --header "$AUTH_HEADER" \
            --header "Content-Type: application/vnd.api+json" \
            "https://app.terraform.io/api/v2/workspaces/${WORKSPACE_ID}/vars" \
            | jq -r '.data[] | select(.attributes.key == "artifact_sha")')

          VAR_ID=$(echo "$VAR_JSON" | jq -r '.id')
          CURRENT_ARTIFACT_SHA=$(echo "$VAR_JSON" | jq -r '.attributes.value')

          if [ "$CURRENT_ARTIFACT_SHA" = "$NEW_ARTIFACT_SHA" ]; then
            echo "✓ Backend artifact unchanged ($NEW_ARTIFACT_SHA) - skipping Terraform Cloud variable update"
          else
            echo "📝 Backend artifact changed ($CURRENT_ARTIFACT_SHA -> $NEW_ARTIFACT_SHA) - updating Terraform Cloud variable"
            curl -s -X PATCH \
              --header "$AUTH_HEADER" \
              --header "Content-Type: application/vnd.api+json" \
              "https://app.terraform.io/api/v2/workspaces/${WORKSPACE_ID}/vars/${VAR_ID}" \
              -d '{"data":{"type":"vars","id":"'"$VAR_ID"'","attributes":{"key":"artifact_sha","category":"terraform","value":"'"$NEW_ARTIFACT_SHA"'","hcl":false,"sensitive":false}}}'
          fi

      - name: Upload Terraform configuration
        id: upload
        uses: hashicorp/tfc-workflows-github/actions/upload-configuration@v1.3.2
        with:
          directory: ./infra
          workspace: ${{ env.TF_WORKSPACE }}
          token: ${{ env.TF_API_TOKEN }}
          organization: ${{ env.TF_ORG }}

      - name: Create Terraform run
        id: run
        uses: hashicorp/tfc-workflows-github/actions/create-run@v1.3.2
        with:
          workspace: ${{ env.TF_WORKSPACE }}
          configuration_version: ${{ steps.upload.outputs.configuration_version_id }}
          token: ${{ env.TF_API_TOKEN }}
          organization: ${{ env.TF_ORG }}

      - name: Terraform summary
        run: |
          echo "## Terraform Deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Terraform Run: ${{ steps.run.outputs.run_link }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Get workspace outputs
        id: website_outputs
        uses: hashicorp/tfc-workflows-github/actions/workspace-output@v1.3.2
        with:
          workspace: ${{ env.TF_WORKSPACE }}
          token: ${{ env.TF_API_TOKEN }}
          organization: ${{ env.TF_ORG }}

      - name: Parse outputs
        id: parsed
        run: |
          echo '${{ steps.website_outputs.outputs.outputs }}' > outputs.json
          echo "bucket=$(jq -r '.[] | select(.name == "frontend_bucket_name") | .value' outputs.json)" >> "$GITHUB_OUTPUT"
          echo "distribution_id=$(jq -r '.[] | select(.name == "cloudfront_distribution_id") | .value' outputs.json)" >> "$GITHUB_OUTPUT"

      - name: Sync frontend to S3
        run: aws s3 sync artifacts/website "s3://${{ steps.parsed.outputs.bucket }}" --delete

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id "${{ steps.parsed.outputs.distribution_id }}" --paths "/*"

  release:
    name: Create Release
    needs: deploy
    if: success()
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@a22cf08638b34d5badda920f9daf6e72c477b07b # v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_branches: main

      - name: Create GitHub release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          tag: ${{ steps.tag_version.outputs.new_tag }}
          name: Release ${{ steps.tag_version.outputs.new_tag }}
          body: |
            ${{ steps.tag_version.outputs.changelog }}

            ---

            **Workflow Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            **Workflow Ran By:** ${{ github.actor }}
            **Commit:** ${{ github.sha }}
