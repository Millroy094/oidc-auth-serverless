<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mainGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#B91C1C"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
  </defs>

  <!-- Outer ring with subtle glow -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="url(#mainGrad)" stroke-width="2" opacity="0.3"/>
  
  <!-- Main background circle -->
  <circle cx="100" cy="100" r="90" fill="url(#mainGrad)"/>
  
  <!-- Subtle inner ring accent -->
  <circle cx="100" cy="100" r="88" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>

  <!-- Left bracket < -->
  <path d="M 50 70 L 40 100 L 50 130" 
        stroke="white" 
        stroke-width="6" 
        fill="none" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        opacity="0.85"/>

  <!-- Right bracket > -->
  <path d="M 150 70 L 160 100 L 150 130" 
        stroke="white" 
        stroke-width="6" 
        fill="none" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        opacity="0.85"/>

  <!-- Letter M with sharp peak -->
  <g fill="white" opacity="0.95">
    <!-- M left vertical -->
    <rect x="72" y="72" width="7" height="50" rx="3.5"/>
    <!-- M peak - sharp point -->
    <polygon points="79,72 85,88 91,72"/>
    <!-- M right vertical -->
    <rect x="91" y="72" width="7" height="50" rx="3.5"/>
  </g>

  <!-- Letter F -->
  <g fill="white" opacity="0.95">
    <!-- F vertical line -->
    <rect x="112" y="72" width="7" height="50" rx="3.5"/>
    <!-- F top horizontal -->
    <rect x="112" y="72" width="20" height="7" rx="3.5"/>
    <!-- F middle horizontal -->
    <rect x="112" y="95" width="15" height="7" rx="3.5"/>
  </g>

  <!-- Subtle accent dots (tech element) -->
  <circle cx="65" cy="50" r="2" fill="rgba(255,255,255,0.5)"/>
  <circle cx="135" cy="50" r="2" fill="rgba(255,255,255,0.5)"/>
  <circle cx="65" cy="150" r="2" fill="rgba(255,255,255,0.5)"/>
  <circle cx="135" cy="150" r="2" fill="rgba(255,255,255,0.5)"/>
</svg>
